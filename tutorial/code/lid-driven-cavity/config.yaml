# Lid-Driven Cavity Simulation Configuration
# MAC (Marker-and-Cell) Method Parameters

# Grid Configuration
x_grid: 16
y_grid: 16

# Computational Domain
length_x: 1.0
length_y: 1.0

# Simulation Parameters
max_steps: 2
viscosity: 0.01
density: 0.5

# SOR (Successive Over-Relaxation) Parameters
max_iterations: 20
beta: 1.5
max_error: 0.01

# Boundary Conditions
u_north: 1.0 # Top wall velocity (lid velocity)
u_south: 0.0 # Bottom wall velocity
v_east: 0.0 # Right wall velocity
v_west: 0.0 # Left wall velocity

# Time Integration
initial_time: 0.0
time_step: 0.001

# Plotting Interval -1 if no plotting is desired
plot_interval: 1
